log syslog all;

router id 10.69.1.90;


protocol device {
  scan time 10;
}

protocol kernel {
  ipv4 { 
    export all;
  };
  scan time 15;
}

protocol static {
  ipv4;
  #route 10.69.1.0/24 via "vlan10";
  #route 192.168.0.0/24 via "vlan100";
  #route 10.69.1.0/24 via "ether3";
}

protocol bfd {
    interface "ether*" {
        min rx interval 50 ms;
        min tx interval 50 ms;
        idle tx interval 300 ms;
      };
    interface "vlan*" {
        min rx interval 50 ms;
        min tx interval 50 ms;
        idle tx interval 300 ms;
      };
  }

protocol ospf HOME {
  ipv4 {
    export none;
    import all;
    #filter {
    #  if net = 10.69.1.0/24 then reject;
    #  accept;
    #};
  };
  area 0.0.0.0 {
    networks {
      10.69.1.0/24;
      10.69.1.0/24;
    };
    interface "ether3" {
      type nbma;
      #strict nonbroadcast yes;
      cost 1;
      hello 15;
      dead 40;
      priority 100;
      retransmit 7;
      bfd yes;
      neighbors {
        10.69.1.1 eligible;
        10.69.1.11 eligible;
        10.69.1.70 eligible;
      };
    };
    interface "vlan10" {
      type nbma;
      #strict nonbroadcast yes;
      cost 1;
      hello 15;
      dead 40;
      priority 100;
      retransmit 7;
      bfd yes;
      neighbors {
        #10.69.1.1 eligible;
        10.69.1.15 eligible;
      };
    };
  };
}

